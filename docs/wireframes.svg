  <path d="M520 1152V1160M520 1198V1206M493 1179H501M539 1179H547" stroke="#dfd7a0" stroke-width="2"/>

  <rect x="350" y="980" width="340" height="42" fill="#142025" fill-opacity="0.9" stroke="#6f807c"/>
  <text x="372" y="1007" class="label">A 2 : 1 B</text><text x="490" y="1007" class="h accent">04:32</text><text x="588" y="1007" class="small">ROUND 4</text>
  <rect x="804" y="979" width="140" height="82" fill="#142025" fill-opacity="0.9" stroke="#6f807c"/>
  <text x="825" y="1007" class="label">W · N · E</text><text x="821" y="1040" class="small">MARKET</text>
  <rect x="94" y="1320" width="218" height="72" fill="#142025" fill-opacity="0.9" stroke="#6f807c"/>
  <text x="111" y="1348" class="label">RIFLE · AUTO</text><text x="111" y="1378" class="h accent">24 / 90</text><text x="222" y="1378" class="small">STAND</text>
  <rect x="752" y="1298" width="192" height="94" fill="#142025" fill-opacity="0.9" stroke="#6f807c"/>
  <text x="769" y="1326" class="label">TEAM A · 3 ALIVE</text><text x="769" y="1352" class="small">● YOU   ● TWO   ● THREE</text><text x="769" y="1377" class="small">× FOUR   × FIVE</text>

  <text x="1016" y="990" class="h">Quiet, readable feedback</text>
  <text x="1016" y="1030" class="sub"><tspan x="1016">Top center: clock and round score.</tspan><tspan x="1016" dy="27">Top right: direction and landmark.</tspan><tspan x="1016" dy="27">Bottom left: weapon and stance.</tspan><tspan x="1016" dy="27">Bottom right: team survival.</tspan></text>
  <path d="M1016 1140H1392" stroke="#3d4b52"/>
  <text x="1016" y="1176" class="label accent">Physical weapon, honest reticle</text>
  <text x="1016" y="1207" class="sub"><tspan x="1016">Camera finds the aim point.</tspan><tspan x="1016" dy="25">Muzzle determines the actual hit.</tspan><tspan x="1016" dy="25">Show when nearby cover blocks fire.</tspan></text>
  <text x="1016" y="1320" class="small"><tspan x="1016">On death: label the watched teammate.</tspan><tspan x="1016" dy="25">No enemy-follow or free camera.</tspan><tspan x="1016" dy="25">HUD remains readable at low world resolution.</tspan></text>
  <text x="48" y="1457" class="tiny">PLANNING ARTIFACT • All dimensions and timings are proposed • See DESIGN.md and PROTOTYPE_PLAN.md for implementation and acceptance criteria</text>
</svg>
